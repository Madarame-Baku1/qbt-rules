# qbt-rules v0.4.0 - Configuration Settings
#
# This file contains all configuration for the qbt-rules client-server architecture.
# For rules definitions, see rules.yml
#
# Configuration Resolution Order (highest to lowest priority):
# 1. CLI flags (e.g., --server-port 5000)
# 2. Environment variable _FILE variant (e.g., QBT_RULES_SERVER_API_KEY_FILE=/secrets/key)
# 3. Environment variable (e.g., QBT_RULES_SERVER_PORT=5000)
# 4. This config file
# 5. Default values
#
# ALL environment variables support _FILE variants for secret management.
# See PLAN.md for complete environment variable reference.

# Schema marker for this file, read via config.get('version', 1) (defaults
# to 1 when absent, so files written before this existed are unaffected).
# Not consulted by qbt-rules today -- a forward-compat hook for tooling that
# needs to tell "this file predates schema versioning" from "this file
# already declared one." Safe to leave as-is; only bump if you're following
# a future migration guide that tells you to.
version: 1

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
# HTTP API server settings (used when running with --serve)

server:
  # Server bind address (0.0.0.0 for all interfaces, 127.0.0.1 for localhost only)
  # Env: QBT_RULES_SERVER_HOST or QBT_RULES_SERVER_HOST_FILE
  host: 0.0.0.0

  # Server port
  # Env: QBT_RULES_SERVER_PORT or QBT_RULES_SERVER_PORT_FILE
  port: 5000

  # API authentication key (REQUIRED - generate with: openssl rand -hex 32)
  # Env: QBT_RULES_SERVER_API_KEY or QBT_RULES_SERVER_API_KEY_FILE
  # IMPORTANT: Use _FILE variant for production with Docker secrets
  api_key: your-secure-api-key-here-generate-a-random-key

  # Gunicorn worker processes (1 is sufficient for home use)
  # Env: QBT_RULES_SERVER_WORKERS or QBT_RULES_SERVER_WORKERS_FILE
  workers: 1

# ============================================================================
# QUEUE CONFIGURATION
# ============================================================================
# Job queue settings (SQLite or Redis)

queue:
  # Queue backend: 'sqlite' (default) or 'redis'
  # Env: QBT_RULES_QUEUE_BACKEND or QBT_RULES_QUEUE_BACKEND_FILE
  # SQLite: Zero dependencies, file-based, perfect for home users
  # Redis: High-performance, in-memory, requires separate Redis server
  backend: sqlite

  # SQLite database path (only used when backend=sqlite)
  # Env: QBT_RULES_QUEUE_SQLITE_PATH or QBT_RULES_QUEUE_SQLITE_PATH_FILE
  sqlite_path: /config/qbt-rules.db

  # Redis connection URL (only used when backend=redis)
  # Env: QBT_RULES_QUEUE_REDIS_URL or QBT_RULES_QUEUE_REDIS_URL_FILE
  # Format: redis://[:password@]host[:port][/database]
  # redis_url: redis://localhost:6379/0

  # Job retention period - how long to keep completed/failed jobs
  # Env: QBT_RULES_QUEUE_CLEANUP_AFTER or QBT_RULES_QUEUE_CLEANUP_AFTER_FILE
  # Format: Xd (days), Xw (weeks), or integer (seconds)
  # Examples: '7d', '2w', '30 days', 604800
  cleanup_after: 7d

# ============================================================================
# CLIENT CONFIGURATION
# ============================================================================
# CLI client settings (used when submitting jobs to server)

client:
  # Server URL for client to connect to
  # Env: QBT_RULES_CLIENT_SERVER_URL or QBT_RULES_CLIENT_SERVER_URL_FILE
  server_url: http://localhost:5000

  # API key for client authentication (must match server.api_key)
  # Env: QBT_RULES_CLIENT_API_KEY or QBT_RULES_CLIENT_API_KEY_FILE
  api_key: your-secure-api-key-here-generate-a-random-key

# ============================================================================
# QBITTORRENT CONFIGURATION
# ============================================================================
# qBittorrent Web UI connection settings

qbittorrent:
  # qBittorrent Web UI URL
  # Env: QBT_RULES_QBITTORRENT_HOST or QBT_RULES_QBITTORRENT_HOST_FILE
  host: http://localhost:8080

  # qBittorrent Web UI username
  # Env: QBT_RULES_QBITTORRENT_USERNAME or QBT_RULES_QBITTORRENT_USERNAME_FILE
  username: admin

  # qBittorrent Web UI password
  # Env: QBT_RULES_QBITTORRENT_PASSWORD or QBT_RULES_QBITTORRENT_PASSWORD_FILE
  # IMPORTANT: Use _FILE variant for production
  password: adminpass

# ============================================================================
# RULES CONFIGURATION
# ============================================================================

rules:
  # Path to rules file
  # Env: QBT_RULES_RULES_FILE or QBT_RULES_RULES_FILE_FILE
  file: /config/rules.yml

# ============================================================================
# SCHEDULE CONFIGURATION (optional)
# ============================================================================
# Internal cron scheduler -- enqueues a job for each entry when its cron
# expression fires, so you don't need an external cron job, systemd timer,
# or sidecar container hitting the HTTP API on a schedule.
#
# Not hot-reloaded (like the rest of config.yml); restart the server to
# pick up changes.
#
# Uncomment and customize:
#
# schedule:
#   - cron: "*/30 * * * *"   # Every 30 minutes
#     context: cron
#   - cron: "0 3 * * *"      # Daily at 3 AM
#     context: nightly
#
# Env: since this is a list, not a single scalar value, it doesn't use the
# QBT_RULES_SCHEDULE_* name a single-value section would -- instead, each
# entry is set via a pair of indexed variables, QBT_RULES_SCHEDULE_<N>_CRON
# and QBT_RULES_SCHEDULE_<N>_CONTEXT (or the _FILE variant of either),
# starting at N=0 and counting up contiguously until the first missing
# index. If ANY QBT_RULES_SCHEDULE_0_CRON is set, the environment-defined
# schedule entirely replaces this section (not merged with it). Example:
#   QBT_RULES_SCHEDULE_0_CRON=*/30 * * * *
#   QBT_RULES_SCHEDULE_0_CONTEXT=cron
#   QBT_RULES_SCHEDULE_1_CRON=0 3 * * *
#   QBT_RULES_SCHEDULE_1_CONTEXT=nightly

# ============================================================================
# NOTIFICATIONS CONFIGURATION (optional)
# ============================================================================
# Defaults for the "notify" action (Discord/Slack/ntfy/generic webhooks).
# Both values can be overridden per-rule via the action's own params, so
# this section is only needed if you want a shared default without
# repeating the URL/service in every rule.

notifications:
  # Default webhook URL used when a notify action omits params.url
  # Env: QBT_RULES_NOTIFICATIONS_WEBHOOK_URL or QBT_RULES_NOTIFICATIONS_WEBHOOK_URL_FILE
  # IMPORTANT: Use the _FILE variant in production -- webhook URLs often
  # embed a secret token, same as any other credential.
  # webhook_url: https://discord.com/api/webhooks/your-webhook-here

  # Default service used when a notify action omits params.service
  # One of: discord, slack, ntfy, generic
  # Env: QBT_RULES_NOTIFICATIONS_SERVICE or QBT_RULES_NOTIFICATIONS_SERVICE_FILE
  service: generic

# ============================================================================
# INTEGRATIONS CONFIGURATION (optional)
# ============================================================================
# Sonarr/Radarr connection details for the "arr_blocklist" action --
# blocklists a bad download in the arr and, by default, triggers a
# re-search (params.search: false to skip that part), correlated via the
# arr's own download queue (not category matching,
# which is a separate concept -- see Advanced-Topics in the wiki).
#
# Uncomment and customize the service(s) you use:
#
# integrations:
#   sonarr:
#     url: http://sonarr:8989
#     # Env: QBT_RULES_INTEGRATIONS_SONARR_URL or QBT_RULES_INTEGRATIONS_SONARR_URL_FILE
#     api_key: your-sonarr-api-key-here
#     # Env: QBT_RULES_INTEGRATIONS_SONARR_API_KEY or QBT_RULES_INTEGRATIONS_SONARR_API_KEY_FILE
#     # IMPORTANT: Use the _FILE variant in production, same as any other credential.
#   radarr:
#     url: http://radarr:7878
#     # Env: QBT_RULES_INTEGRATIONS_RADARR_URL or QBT_RULES_INTEGRATIONS_RADARR_URL_FILE
#     api_key: your-radarr-api-key-here
#     # Env: QBT_RULES_INTEGRATIONS_RADARR_API_KEY or QBT_RULES_INTEGRATIONS_RADARR_API_KEY_FILE
#
#   # trackie (https://github.com/andronics/trackie): private tracker
#   # seeding stats -- what the TRACKER says is still owed -- for the
#   # tracker.* field namespace (tracker.status, tracker.remaining,
#   # tracker.account.ratio_ok, ...). Fetched once per run, only when a rule
#   # uses tracker.*. Missing, stale or unreachable data skips the rule for
#   # that torrent; it never matches on a guess.
#   trackie:
#     url: http://trackie:8080
#     # Env: QBT_RULES_INTEGRATIONS_TRACKIE_URL
#     max_age: 3 hours
#     # Older tracker data counts as no data. Seconds or a duration.
#     # Env: QBT_RULES_INTEGRATIONS_TRACKIE_MAX_AGE
#     timeout: 10
#     # Seconds for the /snapshot request. Env: QBT_RULES_INTEGRATIONS_TRACKIE_TIMEOUT

# ============================================================================
# METRICS CONFIGURATION (optional)
# ============================================================================
# Prometheus metrics via a /metrics endpoint (requires the 'metrics' extra:
# pip install qbt-rules[metrics]). Off by default -- no new dependency or
# directory requirement unless you turn this on. See the wiki's Metrics page
# for the full list of exposed metrics and a sample Prometheus scrape config.
#
# /metrics requires the API key, same as every other endpoint except
# /api/health and /api/version.

metrics:
  # Enable the /metrics endpoint and internal instrumentation
  # Env: QBT_RULES_METRICS_ENABLED or QBT_RULES_METRICS_ENABLED_FILE
  enabled: false

  # Directory used by prometheus_client's multiprocess mode -- required for
  # correct metrics under Gunicorn's multi-worker fork model (server.workers
  # > 1); each worker process writes its own file here, aggregated on every
  # scrape. Cleared automatically on server startup. Defaults to somewhere
  # under /tmp, which is always writable in the standard Docker image with
  # no extra volume needed.
  # Env: QBT_RULES_METRICS_MULTIPROC_DIR or QBT_RULES_METRICS_MULTIPROC_DIR_FILE
  multiproc_dir: /tmp/qbt-rules-metrics

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  # Env: QBT_RULES_LOGGING_LEVEL or QBT_RULES_LOGGING_LEVEL_FILE
  level: INFO

  # Log file path (relative to CONFIG_DIR or absolute)
  # Env: QBT_RULES_LOGGING_FILE or QBT_RULES_LOGGING_FILE_FILE
  file: /config/qbt-rules.log

  # Trace mode: Include module/function/line numbers in logs (for debugging)
  # Env: QBT_RULES_LOGGING_TRACE_MODE or QBT_RULES_LOGGING_TRACE_MODE_FILE
  trace_mode: false

  # Log HTTP access requests (including health checks)
  # Env: QBT_RULES_LOGGING_HTTP_ACCESS or QBT_RULES_LOGGING_HTTP_ACCESS_FILE
  # Set to true to see all HTTP requests (useful for debugging)
  # Set to false (default) to suppress health check logs
  http_access: false

# ============================================================================
# ENGINE SETTINGS
# ============================================================================

engine:
  # Dry-run mode: Test rules without making changes
  # Env: QBT_RULES_DRY_RUN or QBT_RULES_DRY_RUN_FILE
  # Note: Use --dry-run CLI flag instead (preferred)
  dry_run: false

# ============================================================================
# DOCKER ENVIRONMENT VARIABLE EXAMPLE
# ============================================================================
# When running in Docker, use environment variables instead of editing this file.
#
# Example docker-compose.yml:
#
# services:
#   qbt-rules:
#     image: ghcr.io/andronics/qbt-rules:latest
#     environment:
#       # Server config
#       QBT_RULES_SERVER_API_KEY_FILE: /run/secrets/api_key
#       QBT_RULES_SERVER_PORT: "5000"
#
#       # Queue config
#       QBT_RULES_QUEUE_BACKEND: sqlite
#       QBT_RULES_QUEUE_CLEANUP_AFTER: 7d
#
#       # qBittorrent connection
#       QBT_RULES_QBITTORRENT_HOST: http://qbittorrent:8080
#       QBT_RULES_QBITTORRENT_USERNAME: admin
#       QBT_RULES_QBITTORRENT_PASSWORD_FILE: /run/secrets/qbt_password
#
#       # Logging
#       QBT_RULES_LOGGING_LEVEL: INFO
#     secrets:
#       - api_key
#       - qbt_password
#     volumes:
#       - ./config:/config
#     ports:
#       - "5000:5000"
#
# secrets:
#   api_key:
#     file: ./secrets/api_key.txt
#   qbt_password:
#     file: ./secrets/qbt_password.txt
#
# See https://github.com/andronics/qbt-rules/wiki/In‐Depth-Configuration
# and https://github.com/andronics/qbt-rules/wiki/Security for the complete
# configuration and secrets-management reference.
