name: Contribution verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Issue ${{ matrix.issue }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 9
            ref: 738af6bbe0ab60100867b4d3be04b72ec0d6e9b5
          - issue: 10
            ref: 04b49d03a6c7cc8cc86444b586e35af849bb83cc
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out the exact contribution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up the same Python version as upstream CI
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the documented development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run the full test suite with coverage
        run: python -m pytest -q
      - name: Validate the shipped example configuration
        run: |
          config_dir=$(mktemp -d)
          cp config/config.default.yml "$config_dir/config.yml"
          cp config/rules.default.yml "$config_dir/rules.yml"
          python -m qbt_rules.cli --validate --config-dir "$config_dir" 2>&1 | tee validation.txt
          grep -q 'Configuration is valid' validation.txt
      - name: Check the API file has no lint findings
        if: matrix.issue == 10
        run: python -m ruff check src/qbt_rules/api.py
      - name: Verify the lint migration preserves every setting
        if: matrix.issue == 9
        run: |
          git fetch --depth=1 origin 567a68107157cdb99d21883e2854fe16e6830d00
          python - <<'PY'
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          original = subprocess.check_output(
              ['git', 'show', '567a68107157cdb99d21883e2854fe16e6830d00:pyproject.toml'], text=True
          )
          expected = tomllib.loads(original)
          ruff = expected['tool']['ruff']
          ruff['lint'] = {key: ruff.pop(key) for key in ('select', 'ignore', 'per-file-ignores')}
          actual = tomllib.loads(Path('pyproject.toml').read_text())
          assert actual == expected, 'Settings outside the lint table migration changed'
          result = subprocess.run(
              ['python', '-m', 'ruff', 'check', 'src/', '--output-format', 'json'],
              capture_output=True, text=True, check=False,
          )
          findings = json.loads(result.stdout)
          assert result.returncode == 1 and len(findings) == 50
          assert 'deprecated' not in result.stderr.lower(), result.stderr
          print('PASS: all settings preserved; 50 existing findings; no deprecation warning')
          PY
